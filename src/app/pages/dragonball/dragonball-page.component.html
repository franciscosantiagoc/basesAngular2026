<h1>Dragonball page</h1>
<hr>
<section class="row">
  <div class="col-12 col-sm-6">
    <h3>Agregar:</h3>
    <input type="text" class="form-control" placeholder="Nombre"/>
    <input type="number" class="form-control" placeholder="Poder"/>
    <button class="btn btn-primary mx-2 mt-2">Agregar</button>
  </div>

  <div class="col-12 col-sm-6">
    <ul>
      @for (character of characters(); track character.id; let idx=$index) {
        <li>
          <span>{{idx + 1}} {{character.name}}</span>
          <span class="text-danger"> {{character.power}}</span>
        </li>
      }
    </ul>
  </div>
</section>
