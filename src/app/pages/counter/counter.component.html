<h1>Counter Page Component</h1>
<p>Counter: <b>{{ counter }}</b></p>
<p>Counter signal: <b>{{ counterSignal() }}</b></p>
<button (click)="decreaseBy()" class="btn btn-primary mx-2">Decrement</button>
<button (click)="reset()" class="btn btn-primary mx-2">Reset</button>
<button (click)="increaseBy()" class="btn btn-primary mx-2">Increment</button>
